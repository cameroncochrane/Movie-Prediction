<html>
  <head>
    <meta charset="utf-8" />
    <title>Movie Recommender</title>

    <!-- Select2 uses jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

    <!-- Select2 CSS + JS (CDN) -->
    <link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>

    <style>
      body { font-family: sans-serif; margin: 24px; }
      .select2-container { width: 480px !important; }
      .hint { color: #555; }
    </style>
  </head>

  <body>
    <h2>Movie Recommender</h2>
    <p class="hint">Start typing a title</p>

    <form method="post" action="/recommend">
      <label>Movie:</label><br/><br/>

      <!-- Empty select: Select2 populates options from /search as the user types -->
      <select id="movie_id" name="movie_id" required></select>

      <br/><br/>

      <label>How many similar movies?</label>
      <input name="top_n" type="number" min="1" max="50" value="10" />

      <br/><br/>
      <button type="submit">Get recommendations</button>
    </form>

    <script>
      // Turn the <select> into a searchable dropdown backed by AJAX
      $("#movie_id").select2({
        placeholder: "Type a movie title…",
        minimumInputLength: 2,  // don’t query until user typed 2 chars
        ajax: {
          url: "/search",
          dataType: "json",
          delay: 200,           // debounce (ms) so we don’t spam requests
          data: function (params) {
            return { q: params.term };
          },
          processResults: function (data) {
            // data is already in Select2 format: {results: [...]}
            return data;
          },
          cache: true
        }
      });
    </script>
  </body>
</html>
